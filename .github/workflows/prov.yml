# Proven i en stations eget förråd (till exempel Tk-TKL), på varje pull request och varje ändring av main.
# deploy/publish-station.sh lägger den här filen i .github/workflows/prov.yml; ändra den i cda-tkl.
name: Prov
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      # Stationens genererade filer ska stämma med källan (Trakvista.xml, CSV-tabellerna, station.json).
      - run: npm run "verify:$(sed -n 's/^TKL_STATION=//p' packaging/identity.env)"
      - run: npm run -s test:station-traffic
      - run: npm run -s test:station-selection

  windows-bluetooth:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Prova COM-stöd och gateway med syntetisk serieport
        run: node --test test/windows-bluetooth.test.mjs test/connection-mode.test.mjs test/serial-gateway.test.mjs
      - name: Prova COM-inställningarna i en riktig webbläsare
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/tkl-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          & "$env:RUNNER_TEMP/tkl-browser/node_modules/.bin/playwright.cmd" install chromium
          $env:TKL_PLAYWRIGHT_MODULE = ([System.Uri](Join-Path $env:RUNNER_TEMP 'tkl-browser/node_modules/playwright/index.mjs')).AbsoluteUri
          node test/connection-ui.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installera på Windows med bevarade syntetiska driftdata
        shell: pwsh
        run: ./test/windows-install.ps1
